  <style>
    :root { --blue:#005a8b; --navy:#123349; --ink:#172f40; --muted:#526776; --line:#d5e2ea; --wash:#f2f7fa; --white:#fff; --focus:#9e4a00; }

  <script id="hint-data" type="application/json">[
  {
    "id": "1a",
    "title": "Private and efficient pollution reduction",
    "summary": "Find the factory’s private choice of pollution reduction and the level that maximises total surplus, including the restaurant’s cleaning costs.",
    "hints": [
      {
        "category": "Setup",
        "title": "Find the factory’s private choice",
        "text": "The factory compares its own marginal benefit with its marginal cost. Use PMB = PMC, with PMB(x) = 60 − 10x and PMC = 20. Solve for x."
      },
      {
        "category": "Setup",
        "title": "Identify the external benefit",
        "text": "Each extra unit of pollution reduction avoids one unit of smoke. Use the restaurant’s avoided cleaning cost to find the marginal external benefit, MEB. The marginal cost of reduction is the same for the factory and society, so SMC = PMC."
      },
      {
        "category": "Calculation",
        "title": "Include both businesses’ benefits",
        "text": "Social marginal benefit is SMB = PMB + MEB. Add the restaurant’s marginal benefit to the factory’s marginal benefit, then solve SMB = SMC for the efficient level of reduction."
      },
      {
        "category": "Check",
        "title": "Compare the two choices",
        "text": "The restaurant benefits from cleaner air, so the efficient level of reduction should exceed the factory’s private choice. Check that both choices lie between zero and six units."
      }
    ]
  },
  {
    "id": "1b",
    "title": "A Pigouvian subsidy and remaining smoke",
    "summary": "Find the subsidy per unit of pollution reduction, verify the factory’s choice, and explain why efficient pollution reduction can leave some smoke.",
    "hints": [
      {
        "category": "Setup",
        "title": "Set the subsidy using the external benefit",
        "text": "*A* Pigouvian subsidy rewards the factory for the benefit its pollution reduction creates for the restaurant. Set the subsidy per unit, s, equal to MEB at the efficient level from part (a)."
      },
      {
        "category": "Calculation",
        "title": "Recalculate the factory’s choice",
        "text": "With a subsidy, the factory receives its private marginal benefit plus s for each unit of reduction. Solve PMB + s = PMC. Check that this gives the efficient choice from part (a), then calculate remaining smoke as 6 − x."
      },
      {
        "category": "Intuition",
        "title": "Consider one more unit of reduction",
        "text": "Compare SMB and SMC for a unit of reduction beyond your efficient choice. Explain how that comparison determines whether eliminating the remaining smoke would raise total surplus."
      }
    ]
  },
  {
    "id": "1c",
    "title": "Bargaining when the factory has the right to emit",
    "summary": "The restaurant pays for extra pollution reduction. Find the factory’s minimum acceptable payment, the restaurant’s maximum willingness to pay, and the range that benefits both businesses.",
    "hints": [
      {
        "category": "Setup",
        "title": "Identify the outcome without agreement",
        "text": "The subsidy has been removed. If no agreement is reached, the factory chooses the private level of reduction from part (a). Compare that default with the efficient level they agree to implement."
      },
      {
        "category": "Calculation",
        "title": "Find the factory’s required compensation",
        "text": "Evaluate Pi(x) = 40x − 5x² at the default and at the efficient reduction. The factory needs a payment at least as large as the fall in its payoff."
      },
      {
        "category": "Calculation",
        "title": "Find the restaurant’s willingness to pay",
        "text": "Evaluate D(x) = 10(6 − x) at the same two levels of reduction. The restaurant’s maximum payment equals the cleaning costs it saves through the agreement."
      },
      {
        "category": "Check",
        "title": "Put both conditions on the same payment",
        "text": "Call the payment from the restaurant to the factory T. The factory requires T to cover its payoff loss; the restaurant requires T to be no larger than its cleaning-cost saving. These conditions give the lower and upper bounds. At either endpoint, one business is indifferent."
      }
    ]
  },
  {
    "id": "1d",
    "title": "Bargaining when the restaurant has the right to clean air",
    "summary": "The default is full pollution reduction, x = 6. Find the acceptable range for a payment from the factory to the restaurant and compare the agreement with part (c).",
    "hints": [
      {
        "category": "Setup",
        "title": "Start from the new default",
        "text": "The restaurant’s right to clean air makes x = 6 the outcome without agreement. Compare both businesses’ payoffs there with their payoffs at the efficient reduction from part (a)."
      },
      {
        "category": "Calculation",
        "title": "Find the factory’s willingness to pay",
        "text": "The factory gains from moving from full reduction to the efficient level. Calculate Pi(efficient reduction) − Pi(6). This gain sets the most it would pay for permission to emit the remaining smoke."
      },
      {
        "category": "Calculation",
        "title": "Find the restaurant’s required compensation",
        "text": "Calculate the increase in cleaning costs, D(efficient reduction) − D(6). This sets the restaurant’s minimum acceptable payment. Combine it with the factory’s maximum to find the feasible payment range."
      },
      {
        "category": "Intuition",
        "title": "Compare quantity and payment",
        "text": "The efficient reduction maximises the businesses’ combined surplus. Initial rights determine their default payoffs. Use these two observations to compare the agreed reduction, the payer, and the payment range across parts (c) and (d)."
      }
    ]
  },
  {
    "id": "2a",
    "title": "The cost advantage of one network",
    "summary": "Compare one supplier providing 8 TB per month with two suppliers providing 4 TB each. Explain why the cost structure creates a natural monopoly.",
    "hints": [
      {
        "category": "Calculation",
        "title": "Calculate each active supplier’s cost",
        "text": "Use TC(q) = 240 + 20q for each active supplier. For one supplier, substitute its full output. For two suppliers, calculate the cost of each network and add the two costs."
      },
      {
        "category": "Check",
        "title": "Separate fixed and variable costs",
        "text": "Both arrangements supply the same total number of TB, so compare their total variable costs and the number of fixed costs they incur. Check which part accounts for the cost difference."
      },
      {
        "category": "Intuition",
        "title": "Explain the natural monopoly",
        "text": "*A* natural monopoly occurs when one supplier can serve total demand at lower cost than multiple suppliers. Explain what happens to total cost when a second active supplier operates its own network."
      }
    ]
  },
  {
    "id": "2b",
    "title": "The unregulated monopoly outcome",
    "summary": "Find the monopoly quantity and price, producer surplus, profit and consumer surplus. Mark the monopoly outcome and shade consumer surplus on the diagram.",
    "hints": [
      {
        "category": "Calculation",
        "title": "Find quantity, then price",
        "text": "The supplier chooses quantity using MR = MC. Use MR(Q) = 100 − 10Q and MC = 20. Once you have Q, find the price households pay from inverse demand, p = 100 − 5Q."
      },
      {
        "category": "Calculation",
        "title": "Calculate producer surplus and profit",
        "text": "Usage revenue is p × Q and variable cost is 20 × Q. Producer surplus is revenue minus variable cost. To obtain profit, also deduct the network’s monthly fixed cost."
      },
      {
        "category": "Calculation",
        "title": "Use the consumer-surplus triangle",
        "text": "Consumer surplus is the area below demand and above the price, up to the quantity purchased. The triangle’s height is 100 − p and its base is Q, so CS = ½ × (100 − p) × Q."
      },
      {
        "category": "Diagram",
        "title": "Locate the price on demand",
        "text": "At your monopoly quantity, move up to the demand curve to locate the price. Draw guides to the axes. Shade the triangle between that price and demand, from zero usage to the monopoly quantity."
      }
    ]
  },
  {
    "id": "2c",
    "title": "Marginal-cost pricing with a fixed subsidy",
    "summary": "Find usage, profit before subsidy, the minimum subsidy, consumer surplus and its change when the council sets the usage price equal to marginal cost.",
    "hints": [
      {
        "category": "Calculation",
        "title": "Use the regulated price in demand",
        "text": "Set p = MC, then substitute this price into Q = 20 − p/5. The resulting quantity is the amount households demand at the regulated usage price."
      },
      {
        "category": "Calculation",
        "title": "Find the loss that the subsidy must cover",
        "text": "Calculate profit as usage revenue minus variable cost minus fixed cost. At marginal-cost pricing, compare revenue per TB with cost per TB. The minimum fixed subsidy brings the supplier’s profit up to zero."
      },
      {
        "category": "Calculation",
        "title": "Compare consumer-surplus triangles",
        "text": "Use CS = ½ × (100 − p) × Q with the regulated price and quantity. Subtract your consumer surplus from part (b) to find the change. Check how the lower price affects both the triangle’s base and its height."
      }
    ]
  },
  {
    "id": "2d",
    "title": "A subscription fee and actual participation",
    "summary": "Divide the fixed cost equally among all 20 households, decide who subscribes, and calculate the supplier’s actual profit or loss after those choices.",
    "hints": [
      {
        "category": "Calculation",
        "title": "Calculate the proposed monthly fee",
        "text": "The council initially shares the $240 fixed cost across all 20 households. Divide fixed cost by the proposed number of subscribers to find the fee *A*."
      },
      {
        "category": "Participation",
        "title": "Compare each household’s surplus with the fee",
        "text": "The table gives consumer surplus before the subscription fee, relative to keeping basic internet. Subtract *A* from each type’s surplus. A household subscribes if its resulting payoff is at least zero."
      },
      {
        "category": "Calculation",
        "title": "Use the number who actually subscribe",
        "text": "At the $20 per TB usage price, usage revenue covers variable cost. Actual profit therefore equals subscription fees collected minus $240. Multiply *A* by the number of households who choose to subscribe."
      }
    ]
  },
  {
    "id": "2e",
    "title": "Covering costs and preserving efficient access",
    "summary": "Recalculate the fee using the remaining subscribers, check their willingness to pay, and compare access to high-speed internet with the subsidised arrangement in part (c).",
    "hints": [
      {
        "category": "Calculation",
        "title": "Share the cost across the remaining subscribers",
        "text": "Use the number who subscribed in part (d). Divide the $240 fixed cost by that number to find the revised fee per household."
      },
      {
        "category": "Participation",
        "title": "Check the revised fee against both types’ surplus",
        "text": "Compare the revised fee with the surplus of the remaining subscribers to check that they continue to participate. Also check whether the households who declined would subscribe at this fee."
      },
      {
        "category": "Intuition",
        "title": "Consider usage and access separately",
        "text": "Subscribers still face a usage price equal to marginal cost. For access, consider a household that keeps its basic connection because of the fee. Its positive surplus in the table measures the gain from high-speed internet after paying for its data usage."
      },
      {
        "category": "Check",
        "title": "Assess the gain from an additional subscriber",
        "text": "The network’s fixed cost is already covered, and an additional subscriber adds only data supply costs. Those costs are covered by usage payments. Use the excluded households’ surplus to assess how total surplus compares with part (c)."
      }
    ]
  }
]</script>
  <script>
    'use strict';
    const hintData = JSON.parse(document.getElementById('hint-data').textContent);
    const questions = {
      '1': { title:'Cleaner production at a factory', parts:['a','b','c','d'] },
      '2': { title:'High-speed internet in a small town', parts:['a','b','c','d','e'] }
    };
    const parts = Object.fromEntries(hintData.map(part => [part.id, part]));
    const revealed = Object.create(null);
    const main = document.getElementById('main');
    const announcement = document.getElementById('announcement');
    function escapeText(text) { return String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function math(text) {
      const formatted=escapeText(text)
        .replace(/\*([^*]+)\*/g,'<em>$1</em>')
        .replace(/\[\[formula:([^\]]+)\]\]/g,'<span class="formula">$1</span>');
      return formatted.replace(/(?<![’'])\b(PMB|PMC|MEB|SMB|SMC|MR|MC|Pi|Q|q|p|x|s|D|T|F|CS|PS|TS)(?:_([DUI]|total))?(?:\^([SI]))?\b/g, (match,symbol,sub,power) => {
        return '<span class="math"><i>'+(symbol==='Pi'?'Π':symbol)+'</i>'+(sub?'<sub>'+sub+'</sub>':'')+(power?'<sup>'+power+'</sup>':'')+'</span>';
      });
    }
    function route(hash) {
      const match = /^#q([12])(?:\/([a-g]))?$/.exec(hash);
      if (!match) return {};
      const question=match[1], letter=match[2];
      if (letter && !questions[question].parts.includes(letter)) return {};
      return { question, letter };
    }
    function stages(active) {
      return '<ol class="stages" aria-label="Find a hint">'+['Question','Part','Hints'].map((name,index)=>'<li'+(active===index?' aria-current="step"':'')+'><span class="step-number" aria-hidden="true">'+(index+1)+'</span>'+name+'</li>').join('')+'</ol>';
    }
    function nextDestination(question,letter) {
      const questionParts=questions[question].parts, index=questionParts.indexOf(letter);
      if(index<questionParts.length-1) return { href:'#q'+question+'/'+questionParts[index+1], label:'Next part: ('+questionParts[index+1]+') →' };
      if(question==='1') return { href:'#q2', label:'Continue to Question 2 →' };
      return { href:'#', label:'Choose another question →' };
    }
    function render(focus=true) {
      const {question,letter}=route(location.hash);
      announcement.textContent='';
      if (!question) {
        document.title='Week 11 hints | ECF3900';
        main.innerHTML=stages(0)+'<h1 tabindex="-1">Which question are you working on?</h1><p class="intro">Choose a question, then the part you need help with.</p><div class="questions">'+Object.entries(questions).map(([id,q])=>'<a class="question-card" href="#q'+id+'"><span class="number">Question '+id+'</span><h2>'+q.title+'</h2><span class="card-bottom"><span>Parts (a)–('+q.parts.at(-1)+')</span><span class="arrow" aria-hidden="true">→</span></span></a>').join('')+'</div>';
      } else if (!letter) {
        const nextQuestion=question==='1'?'<a class="nav-button next" href="#q2">Next question: Question 2 →</a>':'';
        document.title='Question '+question+' hints | Week 11';
        main.innerHTML=stages(1)+'<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#">← All questions</a></nav><p class="eyebrow">Question '+question+'</p><h1 tabindex="-1">'+questions[question].title+'</h1><p class="intro">Which part would you like a hint for?</p><div class="part-list">'+questions[question].parts.map(letter=>'<a class="part-link" href="#q'+question+'/'+letter+'"><span class="part-letter">('+letter+')</span><span class="part-title">'+escapeText(parts[question+letter].title)+'</span><span class="arrow" aria-hidden="true">→</span></a>').join('')+'</div><nav class="part-navigation" aria-label="Question navigation"><a class="nav-button back" href="#">← Back to question menu</a>'+nextQuestion+'</nav>';
      } else {
        const id=question+letter,part=parts[id],next=nextDestination(question,letter);
        document.title='Question '+question+'('+letter+') hints | Week 11';
        main.innerHTML=stages(2)+'<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#">All questions</a><span class="separator" aria-hidden="true">/</span><a href="#q'+question+'">Question '+question+'</a><span class="separator" aria-hidden="true">/</span><span aria-current="page">Part ('+letter+')</span></nav><p class="eyebrow">Question '+question+'('+letter+')</p><h1 tabindex="-1">'+escapeText(part.title)+'</h1><div class="question-text"><p>'+math(part.summary)+'</p></div><p class="hint-intro">Choose the kind of help you need. You can open any hint.</p><div class="hint-options" id="hint-options"></div><nav class="part-navigation" aria-label="Move between parts"><a class="nav-button back" href="#q'+question+'">← Back to Question '+question+'</a><a class="nav-button next" href="'+next.href+'">'+next.label+'</a></nav>';
        renderHints(id);
      }
      if(focus) { window.scrollTo({top:0,behavior:'auto'}); main.querySelector('h1').focus({preventScroll:true}); }
    }
    function renderHints(id,focusHint=null,focusButton=null) {
      const part=parts[id], open=revealed[id]||(revealed[id]=new Set());
      document.getElementById('hint-options').innerHTML=part.hints.map((hint,index)=>{
        const isOpen=open.has(index), buttonId='hint-button-'+index, panelId='hint-panel-'+index;
        return '<section class="hint-option"><button class="hint-choice" type="button" id="'+buttonId+'" data-hint="'+index+'" aria-expanded="'+isOpen+'" aria-controls="'+panelId+'"><span><span class="choice-kind">'+escapeText(hint.category)+'</span><span class="choice-title">'+escapeText(hint.title)+'</span></span><span class="choice-action">'+(isOpen?'Hide':'Show')+' hint</span></button>'+'<div class="hint" id="'+panelId+'" role="region" aria-labelledby="'+buttonId+'" tabindex="-1"'+(isOpen?'':' hidden')+'><p>'+(isOpen?math(hint.text):'')+'</p></div>'+'</section>';
      }).join('');
      document.querySelectorAll('.hint-choice').forEach(button=>button.addEventListener('click',()=>{
        const index=Number(button.dataset.hint), isOpening=!open.has(index);
        if(isOpening) open.add(index); else open.delete(index);
        renderHints(id,isOpening?index:null,isOpening?null:index);
      }));
      if(focusHint!==null) { document.getElementById('hint-panel-'+focusHint).focus(); announcement.textContent=part.hints[focusHint].category+' hint shown.'; }
      if(focusButton!==null) { document.getElementById('hint-button-'+focusButton).focus(); announcement.textContent=part.hints[focusButton].category+' hint hidden.'; }
    }
    window.addEventListener('hashchange',()=>{ if(location.hash==='#main'){main.querySelector('h1').focus();return;} render(); });
    render(false);
  </script>
</body>
</html>
