  <footer class="footer">Consumer protection: search and hidden quality</footer>
  <script id="hint-data" type="application/json">[
  {
    "id": "1a",
    "title": "The expected quote from each firm",
    "summary": "Calculate the expected quoted price from Firm A and Firm B. Each firm has two equally likely quotes.",
    "hints": [
      {
        "category": "Setup",
        "title": "Use the probabilities in the table",
        "text": "An expected value weights each possible outcome by its probability. Each quote has probability 1/2, so give the lower and higher quotes equal weight."
      },
      {
        "category": "Maths",
        "title": "Average each firm's two quotes",
        "text": "For Firm A, calculate (8 + 12)/2. For Firm B, calculate (4 + 16)/2. This part asks for the expected quote. Account for the search fee and the option of returning to $10 when you reach part (b)."
      },
      {
        "category": "Check",
        "title": "Compare the average and the spread",
        "text": "After calculating the two averages, compare how far each firm's possible quotes lie above and below its average. Keep that difference in mind when deciding where to search in part (b)."
      }
    ]
  },
  {
    "id": "1b",
    "title": "Search while keeping the original offer",
    "summary": "For each firm, find expected savings and total expenditure including the $2 search fee. Compare these with buying immediately for $10.",
    "hints": [
      {
        "category": "Setup",
        "title": "Choose the purchase price in each outcome",
        "text": "After seeing a new quote, the consumer can choose the cheaper of that quote and the original $10 offer. List the price they actually pay after each of Firm A's two quotes, then do the same for Firm B."
      },
      {
        "category": "Maths",
        "title": "Calculate savings before subtracting the fee",
        "text": "For each possible quote, the saving is $10 minus the purchase price you chose. Average the two savings using probabilities 1/2 and 1/2. A quote above $10 gives a saving of zero because the original offer remains available."
      },
      {
        "category": "Maths",
        "title": "Include the search fee once",
        "text": "Expected total expenditure is $10 minus expected saving plus the $2 fee. Equivalently, average the two possible purchase prices and then add $2. Compare the results for A and B with the $10 cost of buying immediately."
      },
      {
        "category": "Intuition",
        "title": "What makes a wider spread useful here?",
        "text": "Keeping the original offer limits the amount the consumer pays after a high quote. Consider which firm offers the larger possible saving after a low quote. This explains why the average quoted price alone may be insufficient to choose where to search."
      }
    ]
  },
  {
    "id": "1c",
    "title": "Search when the original offer expires",
    "summary": "Searching now gives up the original $10 offer. Calculate total expected expenditure for each firm, choose an option and explain the role of returning to the original offer.",
    "hints": [
      {
        "category": "Setup",
        "title": "Use the new purchase rule",
        "text": "A consumer who searches must buy at the new quote. For each firm, both the lower and the higher quote now enter expected expenditure. Buying immediately for $10 remains available before searching."
      },
      {
        "category": "Maths",
        "title": "Reuse your answer to part (a)",
        "text": "For each firm, add the $2 search fee to its expected quote from part (a). Compare both totals with buying immediately. Choose the option with the lowest expected expenditure."
      },
      {
        "category": "Intuition",
        "title": "Compare what happens after a high quote",
        "text": "In part (b), the consumer could return to $10 after an unfavourable quote. In this part, they must pay that higher quote. Explain how keeping the original offer lets the consumer benefit from low quotes while limiting the cost of high ones."
      }
    ]
  },
  {
    "id": "2a",
    "title": "The first-best with observable quality",
    "summary": "Suppose buyers can observe each phone's true quality. Calculate total surplus in the first-best, the efficient outcome with full information.",
    "hints": [
      {
        "category": "Setup",
        "title": "Identify the beneficial trades",
        "text": "Compare each type's value to a buyer with its owner's value of keeping it. A trade creates surplus when the buyer values the phone more. There are ten phones of each type."
      },
      {
        "category": "Maths",
        "title": "Find the gain from one trade of each type",
        "text": "For a high-quality phone, subtract 80 from 100. For a low-quality phone, subtract 20 from 40. These differences measure the additional value created by moving a phone from its owner to a buyer."
      },
      {
        "category": "Maths",
        "title": "Add gains across the phones that trade",
        "text": "Multiply each per-phone gain by the number of that type sold, then add the two amounts. In this full-information case there are no inspection costs. Keep the total to use as your first-best comparison in part (c)."
      }
    ]
  },
  {
    "id": "2b",
    "title": "Price when buyers cannot observe quality",
    "summary": "Calculate the offer if both types are for sale, check sellers' willingness to accept it, then find the equilibrium price with hidden quality.",
    "hints": [
      {
        "category": "Setup",
        "title": "Start with the proposed pool",
        "text": "If all ten high-quality and ten low-quality phones are offered, each type has probability 1/2. Buyers compete up to the expected value of a phone from that pool. Calculate (100 + 40)/2."
      },
      {
        "category": "Check",
        "title": "Ask which owners accept that offer",
        "text": "Compare your pooled offer with $80 for a high-quality owner and $20 for a low-quality owner. Owners sell when the offer is at least as good as keeping their phone. Check whether the proposed pool can survive their decisions."
      },
      {
        "category": "Maths",
        "title": "Update the offer when participation changes",
        "text": "If a type withdraws, buyers must revise their expected value using the phones still offered for sale. Recalculate the price and check both types' decisions again. An equilibrium price must be consistent with the quality of the phones that owners actually sell."
      }
    ]
  },
  {
    "id": "2c",
    "title": "The surplus lost through adverse selection",
    "summary": "Calculate total surplus in the hidden-quality equilibrium from part (b). Compare it with the first-best in part (a) and explain the difference.",
    "hints": [
      {
        "category": "Setup",
        "title": "Use the trades from part (b)",
        "text": "List how many high-quality and low-quality phones actually sell at your equilibrium price. A phone that stays with its original owner contributes zero additional gain from trade."
      },
      {
        "category": "Maths",
        "title": "Count the gains that are realised",
        "text": "Multiply each type's number of sales by its buyer value minus its owner's value of keeping it, then add. Compare this total with your first-best result. The price divides the gain between buyer and seller, so it cancels from total surplus."
      },
      {
        "category": "Intuition",
        "title": "Identify the trades that disappear",
        "text": "Compare which phones trade under full information and hidden quality. For any missing trades, ask whether the buyer still values the phone more than its owner. Use those forgone gains to explain the surplus difference."
      }
    ]
  },
  {
    "id": "2d",
    "title": "Voluntary certification",
    "summary": "Suppose high-quality sellers certify and low-quality sellers sell uncertified. Find prices and compare each owner's options, then calculate total surplus including inspection costs.",
    "hints": [
      {
        "category": "Setup",
        "title": "Work out what each group tells buyers",
        "text": "A trusted certificate reveals the phone's actual quality. In the proposed outcome, buyers also know which type remains uncertified. Use the buyer values in the table to work out the prices in the two groups."
      },
      {
        "category": "Maths",
        "title": "Compare three options for each owner",
        "text": "For each type, compare the certified sale price minus the $5 fee, the uncertified sale price, and the value of keeping the phone. An accurate inspection of a low-quality phone reports low quality. Check that each owner's preferred option supports the proposed outcome."
      },
      {
        "category": "Maths",
        "title": "Subtract the inspector's resource costs",
        "text": "First add buyer value minus owner value across all phones that trade. Then subtract $5 for each inspection actually carried out. Count inspection costs once: the fee paid to the inspector covers the stated $5 resource cost."
      },
      {
        "category": "Check",
        "title": "Compare certification with the first-best",
        "text": "Use the trades you found to compare this outcome with parts (a) and (b). Certification may restore beneficial trades, while the resources used for inspection reduce the surplus from those trades."
      }
    ]
  },
  {
    "id": "2e",
    "title": "Minimum Quality Regulation",
    "summary": "Only high-quality certified phones may be sold. Find who seeks certification, which phones trade and total surplus. Account for restored and lost trades relative to the hidden-quality market.",
    "hints": [
      {
        "category": "Setup",
        "title": "Check who can qualify and who benefits",
        "text": "For a high-quality owner, compare the certified sale price minus $5 with keeping the phone. A low-quality owner knows an accurate inspection will report low quality. Consider whether paying for that inspection could allow a sale under this rule."
      },
      {
        "category": "Maths",
        "title": "Calculate surplus from the permitted trades",
        "text": "For each phone that sells, subtract the owner's value of keeping it from the buyer's value. Add across the phones sold and subtract the real cost of all inspections. Phones kept by their owners create no additional gain from trade."
      },
      {
        "category": "Check",
        "title": "Keep a separate account of gains and losses",
        "text": "Start from the hidden-quality outcome in part (b). Your change in total surplus equals gains from trades restored, minus gains from trades prevented, minus inspection costs. This should agree with your new surplus minus the total from part (c)."
      }
    ]
  },
  {
    "id": "2f",
    "title": "Complete the quality and welfare table",
    "summary": "Use parts (b)–(e) to compare the original market, voluntary certification and minimum quality regulation. Average quality is the average buyer value of the phones sold.",
    "hints": [
      {
        "category": "Setup",
        "title": "Reuse the outcomes you have already found",
        "text": "Use part (b) for the numbers sold in the original market, part (d) for voluntary certification and part (e) for minimum quality regulation. Enter the high-quality and low-quality counts separately for each column."
      },
      {
        "category": "Maths",
        "title": "Weight average quality by the phones sold",
        "text": "Multiply the number of high-quality phones sold by 100 and the number of low-quality phones sold by 40. Add these values and divide by the total number of phones sold. Phones kept by their owners are outside this average."
      },
      {
        "category": "Maths",
        "title": "Separate inspection costs from sale payments",
        "text": "Total inspection costs equal $5 times the number of inspections. Use the total-surplus results from parts (c), (d) and (e) in the final row. A sale payment transfers value between buyer and seller; inspection consumes resources."
      }
    ]
  },
  {
    "id": "2g",
    "title": "Why higher average quality can reduce surplus",
    "summary": "Explain why a policy that raises the average quality of products sold might reduce total surplus.",
    "hints": [
      {
        "category": "Setup",
        "title": "Compare two rows of your table",
        "text": "Look at average buyer value and total surplus in part (f). Identify a policy that raises the first measure while lowering the second relative to the original market."
      },
      {
        "category": "Intuition",
        "title": "Consider the value of the excluded trades",
        "text": "Low-quality phones can still create gains from trade if buyers value them more than their owners do. Explain what happens to those gains when the policy prevents these phones from being sold."
      },
      {
        "category": "Structure",
        "title": "Connect composition, trades and costs",
        "text": "Build your explanation around which phones remain on sale, which beneficial trades take place, and the resources used for inspection. Use your calculations to show how a higher average among the phones sold can coexist with a lower total gain from trade."
      }
    ]
  }
]</script>
  <script>
    'use strict';
    const hintData = JSON.parse(document.getElementById('hint-data').textContent);
    const questions = {
      '1': { title:'The value of another quote', parts:['a','b','c'] },
      '2': { title:'Hidden quality and minimum standards', parts:['a','b','c','d','e','f','g'] }
    };
    const parts = Object.fromEntries(hintData.map(part => [part.id, part]));
    const revealed = Object.create(null);
    const main = document.getElementById('main');
    const announcement = document.getElementById('announcement');
    function escapeText(text) { return String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function math(text) {
      const formatted=escapeText(text)
        .replace(/\*([^*]+)\*/g,'<em>$1</em>')
        .replace(/\[\[formula:([^\]]+)\]\]/g,'<span class="formula">$1</span>');
      return formatted.replace(/\b(MR|MC|pi|Q|q|p|w|c|r|T|F|CS|PS|TS)(?:_([DUI]|total))?(?:\^([SI]))?\b/g, (match,symbol,sub,power) => {
        return '<span class="math"><i>'+(symbol==='pi'?'π':symbol)+'</i>'+(sub?'<sub>'+sub+'</sub>':'')+(power?'<sup>'+power+'</sup>':'')+'</span>';
      });
    }
    function route(hash) {
      const match = /^#q([12])(?:\/([a-g]))?$/.exec(hash);
      if (!match) return {};
      const question=match[1], letter=match[2];
      if (letter && !questions[question].parts.includes(letter)) return {};
      return { question, letter };
    }
    function stages(active) {
      return '<ol class="stages" aria-label="Find a hint">'+['Question','Part','Hints'].map((name,index)=>'<li'+(active===index?' aria-current="step"':'')+'><span class="step-number" aria-hidden="true">'+(index+1)+'</span>'+name+'</li>').join('')+'</ol>';
    }
    function nextDestination(question,letter) {
      const questionParts=questions[question].parts, index=questionParts.indexOf(letter);
      if(index<questionParts.length-1) return { href:'#q'+question+'/'+questionParts[index+1], label:'Next part: ('+questionParts[index+1]+') →' };
      if(question==='1') return { href:'#q2', label:'Continue to Question 2 →' };
      return { href:'#', label:'Choose another question →' };
    }
    function render(focus=true) {
      const {question,letter}=route(location.hash);
      announcement.textContent='';
      if (!question) {
        document.title='Week 10 hints | ECF3900';
        main.innerHTML=stages(0)+'<h1 tabindex="-1">Which question are you working on?</h1><p class="intro">Choose a question, then the part you need help with.</p><div class="questions">'+Object.entries(questions).map(([id,q])=>'<a class="question-card" href="#q'+id+'"><span class="number">Question '+id+'</span><h2>'+q.title+'</h2><span class="card-bottom"><span>Parts (a)–('+q.parts.at(-1)+')</span><span class="arrow" aria-hidden="true">→</span></span></a>').join('')+'</div>';
      } else if (!letter) {
        const nextQuestion=question==='1'?'<a class="nav-button next" href="#q2">Next question: Question 2 →</a>':'';
        document.title='Question '+question+' hints | Week 10';
        main.innerHTML=stages(1)+'<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#">← All questions</a></nav><p class="eyebrow">Question '+question+'</p><h1 tabindex="-1">'+questions[question].title+'</h1><p class="intro">Which part would you like a hint for?</p><div class="part-list">'+questions[question].parts.map(letter=>'<a class="part-link" href="#q'+question+'/'+letter+'"><span class="part-letter">('+letter+')</span><span class="part-title">'+escapeText(parts[question+letter].title)+'</span><span class="arrow" aria-hidden="true">→</span></a>').join('')+'</div><nav class="part-navigation" aria-label="Question navigation"><a class="nav-button back" href="#">← Back to question menu</a>'+nextQuestion+'</nav>';
      } else {
        const id=question+letter,part=parts[id],next=nextDestination(question,letter);
        document.title='Question '+question+'('+letter+') hints | Week 10';
        main.innerHTML=stages(2)+'<nav class="breadcrumb" aria-label="Breadcrumb"><a href="#">All questions</a><span class="separator" aria-hidden="true">/</span><a href="#q'+question+'">Question '+question+'</a><span class="separator" aria-hidden="true">/</span><span aria-current="page">Part ('+letter+')</span></nav><p class="eyebrow">Question '+question+'('+letter+')</p><h1 tabindex="-1">'+escapeText(part.title)+'</h1><div class="question-text"><p>'+math(part.summary)+'</p></div><p class="hint-intro">Choose the kind of help you need. You can open any hint.</p><div class="hint-options" id="hint-options"></div><nav class="part-navigation" aria-label="Move between parts"><a class="nav-button back" href="#q'+question+'">← Back to Question '+question+'</a><a class="nav-button next" href="'+next.href+'">'+next.label+'</a></nav>';
        renderHints(id);
      }
      if(focus) { window.scrollTo({top:0,behavior:'auto'}); main.querySelector('h1').focus({preventScroll:true}); }
    }
    function renderHints(id,focusHint=null,focusButton=null) {
      const part=parts[id], open=revealed[id]||(revealed[id]=new Set());
      document.getElementById('hint-options').innerHTML=part.hints.map((hint,index)=>{
        const isOpen=open.has(index), buttonId='hint-button-'+index, panelId='hint-panel-'+index;
        return '<section class="hint-option"><button class="hint-choice" type="button" id="'+buttonId+'" data-hint="'+index+'" aria-expanded="'+isOpen+'" aria-controls="'+panelId+'"><span><span class="choice-kind">'+escapeText(hint.category)+'</span><span class="choice-title">'+escapeText(hint.title)+'</span></span><span class="choice-action">'+(isOpen?'Hide':'Show')+' hint</span></button>'+'<div class="hint" id="'+panelId+'" role="region" aria-labelledby="'+buttonId+'" tabindex="-1"'+(isOpen?'':' hidden')+'><p>'+(isOpen?math(hint.text):'')+'</p></div>'+'</section>';
      }).join('');
      document.querySelectorAll('.hint-choice').forEach(button=>button.addEventListener('click',()=>{
        const index=Number(button.dataset.hint), isOpening=!open.has(index);
        if(isOpening) open.add(index); else open.delete(index);
        renderHints(id,isOpening?index:null,isOpening?null:index);
      }));
      if(focusHint!==null) { document.getElementById('hint-panel-'+focusHint).focus(); announcement.textContent=part.hints[focusHint].category+' hint shown.'; }
      if(focusButton!==null) { document.getElementById('hint-button-'+focusButton).focus(); announcement.textContent=part.hints[focusButton].category+' hint hidden.'; }
    }
    window.addEventListener('hashchange',()=>{ if(location.hash==='#main'){main.querySelector('h1').focus();return;} render(); });
    render(false);
  </script>
</body>
</html>
