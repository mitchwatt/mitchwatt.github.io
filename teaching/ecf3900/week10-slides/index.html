  <script>
    'use strict';
    try {
      const encoded = document.getElementById('pdf-data').textContent.trim();
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      const pdfURL = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      for (const id of ['open-pdf', 'download-pdf']) {
        const link = document.getElementById(id);
        link.href = pdfURL;
        link.hidden = false;
      }
      const viewer = document.getElementById('slides');
      viewer.src = pdfURL + '#view=FitH';
      viewer.hidden = false;
      document.getElementById('status').textContent = 'If the preview is unavailable on your device, use Open PDF or Download PDF above.';

      document.getElementById('status').textContent = 'The slides could not be loaded. Please reload this page and try again.';
